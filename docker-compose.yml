name: kankei

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kankei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kankei}
      POSTGRES_DB: ${POSTGRES_DB:-kankei}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # enables the pgvector extension
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false          # works from a fresh clone with no .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kankei}:${POSTGRES_PASSWORD:-kankei}@db:5432/${POSTGRES_DB:-kankei}
      LLM_CACHE_DIR: /app/data/llm_cache
      SESSION_FILE: /app/data/sessions.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend/data:/app/data  # corpus, playbook and the committed LLM cache live here
    depends_on:
      db:
        condition: service_healthy
    # seed corpus (only if empty) -> load datasets + embeddings (idempotent) -> API
    command: >
      sh -c "python scripts/seed_corpus.py --if-empty &&
             python scripts/load_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # baked in at build time; the browser calls the API on the host machine
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
